<title>Kpop Boosters</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: sticky header, pack grid or collection on the left, detail panel on the right, stacked on phones. */
:root {
  --bg: #0b0b0f;
  --surface: #14141b;
  --surface-2: #1b1b25;
  --line: #2a2a36;
  --fg: #f2f2f5;
  --muted: #8b8b99;
  --accent: #facc15;
  --accent-fg: #15120a;
  --discord: #5865f2;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f4f4f7; --surface: #ffffff; --surface-2: #eceef3; --line: #d9dbe3;
    --fg: #15151c; --muted: #5d5f6b; --accent: #d89f00; --accent-fg: #15120a;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f4f4f7; --surface: #ffffff; --surface-2: #eceef3; --line: #d9dbe3;
  --fg: #15151c; --muted: #5d5f6b; --accent: #d89f00; --accent-fg: #15120a;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.5 "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: 32px;
}
button, select { font: inherit; color: inherit; cursor: pointer; }
select { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; }
button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }

header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding-block: 12px;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding-inline: max(16px, env(safe-area-inset-left, 0px));
}
.logo { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: .04em; }
.logo-mark {
  width: 28px; height: 28px; border-radius: 8px; background: var(--accent);
  color: var(--accent-fg); display: grid; place-items: center; font-weight: 800;
}
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav button {
  background: none; border: 0; padding: 6px 10px; border-radius: 8px; color: var(--muted);
}
nav button[aria-current="page"] { color: var(--fg); background: var(--surface-2); }
.hud { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pill {
  display: flex; gap: 8px; align-items: center; padding: 6px 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
}
.discord-btn {
  background: var(--discord); color: #fff; border: 0; border-radius: 999px; padding: 7px 14px; font-weight: 600;
}
.avatar {
  width: 30px; height: 30px; border-radius: 50%; background: var(--surface-2);
  border: 1px solid var(--line); display: grid; place-items: center; font-size: 12px; font-weight: 700;
}

main {
  display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px;
  padding-top: 24px; align-items: start;
}
@media (max-width: 860px) { main { grid-template-columns: minmax(0, 1fr); } }
h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -.01em; text-wrap: balance; }
.sub { color: var(--muted); margin: 0 0 16px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
.tile {
  text-align: left; background: var(--surface); border: 1px solid var(--line);
  border-radius: 14px; padding: 10px; display: grid; gap: 8px; min-width: 0;
}
.tile[aria-pressed="true"] { border-color: var(--accent); }
.pack {
  aspect-ratio: 3 / 4; border-radius: 10px; position: relative; overflow: hidden;
  background: linear-gradient(160deg, var(--c1), var(--c2));
  display: grid; place-items: center; max-width: 100%;
}
.pack::before {
  content: ""; position: absolute; inset: 8px; border: 1px solid rgba(255,255,255,.35); border-radius: 8px;
}
.pack-name { font-weight: 800; color: #fff; font-size: 18px; text-shadow: 0 2px 8px rgba(0,0,0,.35); text-align: center; padding: 0 8px; text-wrap: balance; }
.pack-meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; min-width: 0; gap: 8px; }
.tile-name { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }

aside.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px;
  display: grid; gap: 14px; min-width: 0;
}
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat { background: var(--surface-2); border-radius: 10px; padding: 10px; min-width: 0; }
.stat b { display: block; font-size: 20px; }
.stat span { color: var(--muted); font-size: 12px; }
.chance { display: grid; gap: 6px; }
.chance-row { display: grid; grid-template-columns: 90px 1fr 54px; gap: 8px; align-items: center; font-size: 13px; }
.bar { height: 6px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--c); min-width: 2px; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { background: none; border: 0; border-radius: 999px; padding: 5px 12px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); font-weight: 700; }
.qty-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.open-btn {
  background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 12px;
  padding: 14px; font-weight: 800; font-size: 16px; display: flex; justify-content: space-between;
}
.open-btn:disabled { opacity: .5; cursor: not-allowed; }
.cooldown { color: var(--muted); font-size: 12px; }

/* Collection */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.chips-inline { display: flex; flex-wrap: wrap; gap: 6px; }
.chips-inline span { font-size: 12px; background: var(--surface-2); border-radius: 999px; padding: 3px 9px; }
.cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
.ccard {
  aspect-ratio: 3 / 4; border-radius: 10px; padding: 8px; display: grid; align-content: space-between;
  background: linear-gradient(160deg, var(--c1), var(--c2)); color: #fff; min-width: 0; text-align: left;
  border: 2px solid var(--rc, transparent); position: relative;
}
.ccard:not(:disabled):hover { transform: translateY(-2px); }
.ccard:disabled { cursor: default; filter: grayscale(1) brightness(.5); border-style: dashed; }
.ccard b { font-size: 13px; overflow-wrap: anywhere; }
.ccard small { font-size: 11px; opacity: .9; overflow-wrap: anywhere; }
.ccard .r { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
.ccard .cnt {
  position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,.55); border-radius: 999px;
  font-size: 11px; padding: 1px 7px; font-weight: 700;
}
.empty { color: var(--muted); padding: 24px 0; grid-column: 1 / -1; }

dialog {
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  border-radius: 16px; width: min(560px, calc(100% - 32px)); padding: 20px;
}
dialog::backdrop { background: rgba(0,0,0,.7); }
.row { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.ghost { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; }
.note { color: var(--muted); font-size: 12px; margin-top: 16px; }
.detail { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 480px) { .detail { grid-template-columns: 1fr; } }
.hidden-view[hidden] { display: none !important; }

/* Ouverture de booster */
#open-dialog { width: min(640px, calc(100% - 24px)); padding: 0; overflow: hidden; }
.stage {
  position: relative; min-height: 460px; display: grid; grid-template-rows: auto 1fr auto;
  padding: 16px; gap: 12px; background: radial-gradient(circle at 50% 40%, var(--glow, transparent), var(--surface) 70%);
  overflow: hidden;
}
.stage.shake { animation: shake .5s linear 2; }
@keyframes shake { 0%,100% { transform: translate(0); } 20% { transform: translate(-4px,2px); } 40% { transform: translate(4px,-2px); } 60% { transform: translate(-3px,3px); } 80% { transform: translate(3px,-3px); } }
.stage-top { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); }
.stage-center { display: grid; place-items: center; min-height: 300px; position: relative; }
.stage-bottom { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.big-btn {
  background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 12px;
  padding: 12px 22px; font-weight: 800; font-size: 15px;
}
.sealed {
  width: 180px; aspect-ratio: 3 / 4; border-radius: 14px; position: relative; cursor: pointer; border: 0; padding: 0;
  background: linear-gradient(160deg, var(--c1), var(--c2)); color: #fff; font-weight: 800; font-size: 20px;
  display: grid; place-items: center; box-shadow: 0 20px 40px rgba(0,0,0,.4);
  transition: transform .2s ease;
}
.sealed:hover { transform: translateY(-4px) rotate(-1deg); }
.sealed.tear { animation: tear .6s ease forwards; }
@keyframes tear { 0% { transform: none; opacity: 1; } 40% { transform: rotate(-6deg) scale(1.05); } 100% { transform: translateY(-60px) rotate(12deg) scale(.6); opacity: 0; } }

/* Carte à retourner */
.flip-wrap { perspective: 900px; width: 180px; aspect-ratio: 3 / 4; }
.flip {
  position: relative; width: 100%; height: 100%; transform-style: preserve-3d;
  transition: transform .9s cubic-bezier(.34,1.35,.64,1);
}
.flip.open { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0; backface-visibility: hidden; border-radius: 14px; padding: 12px;
  display: grid; align-content: space-between; color: #fff; overflow: hidden;
}
.face.back { background: repeating-linear-gradient(45deg, #1d1d2c 0 10px, #15151f 10px 20px); border: 2px solid var(--line); place-items: center; color: var(--muted); font-size: 42px; font-weight: 800; }
.face.back span { width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--muted); background: var(--bg); }
.face.front { background: linear-gradient(160deg, var(--c1), var(--c2)); transform: rotateY(180deg); border: 3px solid var(--rc); }
.face.front b { font-size: 17px; overflow-wrap: anywhere; }
.face.front small { font-size: 12px; opacity: .9; }
.face.front .r { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; font-weight: 800; }
.face.front.legend { box-shadow: 0 0 40px rgba(250,204,21,.7); }
.face.front.mythic { box-shadow: 0 0 60px rgba(239,68,68,.8), 0 0 120px rgba(168,85,247,.5); }
.flip-wrap.legend-fx .face.front { animation: pulseGold 1.2s ease-in-out infinite alternate; }
.flip-wrap.mythic-fx .face.front { animation: pulseMythic .8s ease-in-out infinite alternate; }
@keyframes pulseGold { to { box-shadow: 0 0 70px rgba(250,204,21,1); } }
@keyframes pulseMythic { to { box-shadow: 0 0 90px rgba(239,68,68,1), 0 0 160px rgba(168,85,247,.8); } }

/* Effets */
.fx-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.burst {
  position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%;
  border: 3px solid var(--fx); opacity: 0; animation: ring .9s ease-out forwards;
}
.burst.b2 { animation-delay: .15s; }
@keyframes ring { 0% { transform: scale(.2); opacity: 1; } 100% { transform: scale(9); opacity: 0; } }
.spark {
  position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; border-radius: 50%; background: var(--fx);
  opacity: 0; animation: spark 1s ease-out forwards;
}
@keyframes spark { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }
.banner {
  position: absolute; left: 0; right: 0; top: 14%; text-align: center; font-weight: 900; font-size: 28px;
  letter-spacing: .12em; color: var(--fx); text-shadow: 0 0 18px var(--fx); pointer-events: none;
  animation: bannerIn .6s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes bannerIn { from { transform: scale(1.6); opacity: 0; } to { transform: none; opacity: 1; } }
.fx-mythic-screen { animation: flash .6s ease-out; }
@keyframes flash { 0% { box-shadow: inset 0 0 0 9999px rgba(239,68,68,.35); } 100% { box-shadow: inset 0 0 0 9999px transparent; } }
.summary { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; max-height: 360px; overflow: auto; }
.summary .mini { border-radius: 10px; padding: 8px; color: #fff; min-height: 110px; display: grid; align-content: space-between; border: 2px solid var(--rc); background: linear-gradient(160deg, var(--c1), var(--c2)); }
.summary .mini b { font-size: 12px; overflow-wrap: anywhere; }
.summary .mini small { font-size: 10px; opacity: .9; }
.summary .mini .r { font-size: 9px; text-transform: uppercase; letter-spacing: .08em; font-weight: 800; }


/* Animation de révélation améliorée */
.flip-wrap { transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .25s ease-out; cursor: pointer; }
.flip-wrap:not(.revealed) { animation: float 3.2s ease-in-out infinite; }
@keyframes float { 0%, 100% { translate: 0 0; } 50% { translate: 0 -6px; } }
.flip-wrap.revealed { cursor: default; }
.face.front .shine {
  position: absolute; inset: 0; pointer-events: none; opacity: 0; transform: translateX(-120%);
  background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.55) 50%, transparent 65%);
}
.flip.open .face.front .shine { animation: sweep 1.1s .45s ease-out forwards; }
@keyframes sweep { 0% { transform: translateX(-120%); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateX(120%); opacity: 0; } }
.rays {
  position: absolute; left: 50%; top: 50%; width: 420px; height: 420px; margin: -210px 0 0 -210px;
  border-radius: 50%; opacity: 0; pointer-events: none; transition: opacity .6s ease;
  background: repeating-conic-gradient(from 0deg, rgba(250,204,21,.4) 0 6deg, transparent 6deg 18deg);
  animation: spin 9s linear infinite;
}
.flip-wrap.l.revealed .rays, .flip-wrap.m.revealed .rays { opacity: 1; }
.flip-wrap.m .rays { background: repeating-conic-gradient(from 0deg, rgba(239,68,68,.45) 0 5deg, rgba(168,85,247,.35) 5deg 10deg, transparent 10deg 20deg); animation-duration: 5s; }
@keyframes spin { to { transform: rotate(360deg); } }
.face.front::before {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: overlay;
}
.flip-wrap.e .face.front::before { background: linear-gradient(120deg, #a855f7, transparent 60%); opacity: .25; }
.flip-wrap.l .face.front::before { background: linear-gradient(120deg, #fde68a, #facc15, #fff7c2, #facc15); opacity: .35; }
.flip-wrap.m .face.front::before { background: linear-gradient(120deg, #f0abfc, #22d3ee, #fde047, #f472b6, #a78bfa); opacity: .45; animation: holo 2.4s linear infinite; background-size: 200% 200%; }
@keyframes holo { to { background-position: 200% 0; } }
.flip-wrap.revealed.l .face.front, .flip-wrap.revealed.m .face.front { animation: none; }
.flip-wrap.revealed.m .face.front { animation: pulseMythic .8s ease-in-out infinite alternate; }
@media (prefers-reduced-motion: reduce) {
  .flip-wrap, .flip-wrap:not(.revealed), .rays, .face.front::before, .flip.open .face.front .shine { animation: none !important; transition: none; }
  .flip-wrap { transform: none !important; }
}
@media (prefers-reduced-motion: reduce) {
  .stage.shake, .burst, .spark, .banner, .fx-mythic-screen, .flip-wrap.legend-fx .face.front, .flip-wrap.mythic-fx .face.front { animation: none; }
  .flip { transition: none; }
}
</style>

<header>
  <div class="logo"><span class="logo-mark">K</span>KPOP BOOSTERS</div>
  <nav aria-label="Principal">
    <button id="nav-boosters" aria-current="page">Boosters</button>
    <button id="nav-collection">Collection</button>
  </nav>
  <div class="hud">
    <div class="pill mono"><span id="owned-count">0/0</span></div>
    <div class="pill mono"><span id="coins">567</span> ◆</div>
    <button id="test-coins" class="ghost mono" title="Bouton de test, à retirer avant la mise en ligne">+150 000 ◆ (test)</button>
    <button id="discord" class="discord-btn">Se connecter avec Discord</button>
  </div>
</header>

<main>
  <section id="view-boosters">
    <h1>Choisis ton booster</h1>
    <p class="sub">Un booster par thème. Chaque booster donne 5 cartes tirées au hasard dans le thème.</p>
    <div id="grid" class="grid"></div>
  </section>

  <section id="view-collection" class="hidden-view" hidden>
    <h1>Ta collection</h1>
    <p class="sub" id="coll-sub"></p>
    <div class="toolbar">
      <div class="seg" role="group" aria-label="Statut">
        <button data-status="all" aria-pressed="true">Toutes</button>
        <button data-status="owned" aria-pressed="false">Possédées</button>
        <button data-status="missing" aria-pressed="false">Manquantes</button>
      </div>
      <select id="theme-filter" aria-label="Thème"></select>
      <select id="rarity-filter" aria-label="Rareté">
        <option value="all">Toutes les raretés</option>
        <option value="Mythique">Mythique</option>
        <option value="Légendaire">Légendaire</option>
        <option value="Épique">Épique</option>
        <option value="Rare">Rare</option>
      </select>
    </div>
    <div id="coll-stats" class="chips-inline" style="margin-bottom:14px"></div>
    <div id="collection" class="cgrid"></div>
  </section>

  <aside class="panel" id="panel" aria-live="polite"></aside>
</main>

<dialog id="open-dialog" aria-labelledby="open-title">
  <div class="stage" id="stage">
    <div class="stage-top">
      <span id="open-title">Ouverture</span>
      <span id="progress" class="mono"></span>
    </div>
    <div class="stage-center" id="center"></div>
    <div class="stage-bottom" id="actions"></div>
  </div>
</dialog>

<dialog id="card-dialog" aria-labelledby="card-title">
  <h2 id="card-title" style="margin:0">Carte</h2>
  <div id="card-detail" class="detail" style="margin-top:12px"></div>
  <div class="row" style="margin-top:12px">
    <button class="ghost" id="close-card">Fermer</button>
  </div>
</dialog>

    ? [name]
    : Array.from({ length: 4 }, (_, i) => `Membre ${i + 1}`));
  return { name, type: name === "CORTIS" ? "boy" : "girl", list };
});
const byName = Object.fromEntries(GROUPS.map(g => [g.name, g]));
function membersOf(g) { return g.list; }

// Les packs sont des thèmes. Un groupe peut apparaître dans plusieurs packs.
const THEMES = [
  { id: "girl", name: "Girl group", groups: GROUPS.filter(g => g.type === "girl").map(g => g.name) },
  { id: "boy", name: "Boy group", groups: ["CORTIS"] },
  { id: "g1", name: "1re génération", groups: ["Lee Hyori"] },
  { id: "g2", name: "2e génération", groups: ["Girls' Generation", "Wonder Girls"] },
  { id: "g3", name: "3e génération", groups: ["TWICE", "BLACKPINK", "Red Velvet", "GFRIEND", "AOA", "LOONA", "MOMOLAND"] },
  { id: "g4", name: "4e génération", groups: ["ITZY", "aespa", "i-dle", "fromis_9", "IVE", "NewJeans", "LE SSERAFIM", "XG", "NMIXX", "FIFTY FIFTY", "HWASA"] },
  { id: "g5", name: "5e génération", groups: ["ILLIT", "KiiiKiii", "TRIPLES", "BABYMONSTER", "Heart2heart", "KATSEYE", "KISS OF LIFE", "IZNA", "ALL DAY PROJECT", "MEOVV", "BESTie", "BIBI", "Loossemble", "GIRLSET", "Rescene", "IFEYE", "TUIDE", "YENA"] }
];
const THEME_HUE = { girl: 330, boy: 200, g1: 40, g2: 25, g3: 280, g4: 170, g5: 130 };
const PACK_PRICE = 150;
const CARDS_PER_PACK = 5;
const QUANTITIES = [1, 5, 10];
const COOLDOWN_MS = 10 * 60 * 1000;
// Du plus rare au plus commun ; l'index sert à comparer les raretés.
const RARITIES = [
  { key: "Mythique", color: "#ef4444", cumul: 0.33, fx: "#ef4444" },
  { key: "Légendaire", color: "#facc15", cumul: 2.33, fx: "#facc15" },
  { key: "Épique", color: "#a855f7", cumul: 19.93, fx: "#a855f7" },
  { key: "Rare", color: "#3b82f6", cumul: 100, fx: "#3b82f6" }
];
const rarityIndex = key => RARITIES.findIndex(r => r.key === key);
const rarityByKey = key => RARITIES.find(r => r.key === key);
const CHANCES = [
  { key: "Rare", color: "#3b82f6", pct: 94.1 },
  { key: "Épique", color: "#a855f7", pct: 17.6 },
  { key: "Légendaire", color: "#facc15", pct: 2 },
  { key: "Mythique", color: "#ef4444", pct: 0.33 }
];

// Stockage local au navigateur uniquement (pas de synchronisation Discord).
// owned[groupe][membre] = { n: nombre d'exemplaires, r: meilleure rareté }
const store = {
  load() {
    const def = { coins: 567, owned: {}, last: 0, discord: null, current: THEMES[0].id };
    try {
      const s = Object.assign(def, JSON.parse(localStorage.getItem("kpop-boosters") || "{}"));
      // Migration de l'ancien format (nombre seul).
      for (const g of Object.keys(s.owned)) {
        for (const m of Object.keys(s.owned[g])) {
          const v = s.owned[g][m];
          if (typeof v === "number") s.owned[g][m] = { n: v, r: "Rare" };
        }
      }
      return s;
    } catch (e) { return def; }
  },
  save(s) { try { localStorage.setItem("kpop-boosters", JSON.stringify(s)); } catch (e) {} }
};
let state = store.load();
let collFilter = { status: "all", theme: "all", rarity: "all" };
let selectedQty = 1;

function themeOf(id) { return THEMES.find(t => t.id === id) || THEMES[0]; }
function themesOfGroup(name) { return THEMES.filter(t => t.groups.includes(name)); }
function packColors(id) {
  const h = THEME_HUE[id] ?? 200;
  return { c1: `hsl(${h} 70% 55%)`, c2: `hsl(${(h + 40) % 360} 60% 22%)` };
}
function groupColors(name) {
  const t = themesOfGroup(name)[0] || THEMES[0];
  return packColors(t.id);
}
function rollRarity() {
  const r = Math.random() * 100;
  return RARITIES.find(x => r < x.cumul);
}
function pickCard(theme) {
  const gName = theme.groups[Math.floor(Math.random() * theme.groups.length)];
  const g = byName[gName];
  const members = membersOf(g);
  return { group: g.name, member: members[Math.floor(Math.random() * members.length)] };
}
function allCards() {
  const out = [];
  for (const g of GROUPS) for (const m of membersOf(g)) out.push({ group: g.name, member: m });
  return out;
}
function cardEntry(group, member) {
  return (state.owned[group] && state.owned[group][member]) || null;
}
function totals() {
  const all = allCards();
  const unique = all.filter(c => cardEntry(c.group, c.member)).length;
  return { unique, total: all.length };
}
function isFree() { return Date.now() - state.last >= COOLDOWN_MS; }

function renderHud() {
  document.getElementById("coins").textContent = state.coins;
  const t = totals();
  document.getElementById("owned-count").textContent = `${t.unique}/${t.total}`;
  if (state.discord) {
    const btn = document.getElementById("discord");
    if (btn) btn.outerHTML = `<div class="pill"><span class="avatar">${state.discord.name[0]}</span>${state.discord.name}</div>`;
  }
}

function renderGrid() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  for (const t of THEMES) {
    const { c1, c2 } = packColors(t.id);
    const b = document.createElement("button");
    b.className = "tile";
    b.setAttribute("aria-pressed", String(state.current === t.id));
    b.innerHTML = `
      <div class="pack" style="--c1:${c1};--c2:${c2}">
        <div class="pack-name">${t.name}</div>
      </div>
      <div class="tile-name">${t.name}</div>
      <div class="pack-meta"><span>${t.groups.length} groupe${t.groups.length > 1 ? "s" : ""}</span><span class="mono">${PACK_PRICE} ◆</span></div>`;
    b.addEventListener("click", () => { state.current = t.id; store.save(state); renderGrid(); renderPanel(); });
    grid.appendChild(b);
  }
}

function populateThemeFilter() {
  const sel = document.getElementById("theme-filter");
  sel.innerHTML = `<option value="all">Tous les thèmes</option>` +
    THEMES.map(t => `<option value="${t.id}">${t.name}</option>`).join("");
  sel.value = collFilter.theme;
}

function renderCollection() {
  const wrap = document.getElementById("collection");
  const all = allCards();
  const ownedCount = all.filter(c => cardEntry(c.group, c.member)).length;
  document.getElementById("coll-sub").textContent =
    `${ownedCount} carte${ownedCount > 1 ? "s" : ""} sur ${all.length}. Touche une carte possédée pour la voir en détail.`;

  const groupsInScope = collFilter.theme === "all"
    ? GROUPS.map(g => g.name)
    : themeOf(collFilter.theme).groups;
  let cards = all.filter(c => groupsInScope.includes(c.group));

  const counts = { Mythique: 0, Légendaire: 0, Épique: 0, Rare: 0 };
  for (const c of cards) {
    const e = cardEntry(c.group, c.member);
    if (e && counts[e.r] !== undefined) counts[e.r]++;
  }
  document.getElementById("coll-stats").innerHTML = RARITIES.map(r =>
    `<span style="color:${r.color}">${r.key} · ${counts[r.key]}</span>`).join("");

  cards = cards.filter(c => {
    const e = cardEntry(c.group, c.member);
    if (collFilter.status === "owned" && !e) return false;
    if (collFilter.status === "missing" && e) return false;
    if (collFilter.rarity !== "all") return !!e && e.r === collFilter.rarity;
    return true;
  });

  wrap.innerHTML = "";
  if (!cards.length) {
    wrap.innerHTML = `<p class="empty">Aucune carte ne correspond à ces filtres.</p>`;
    return;
  }
  for (const c of cards) {
    const e = cardEntry(c.group, c.member);
    const { c1, c2 } = groupColors(c.group);
    const b = document.createElement("button");
    b.className = "ccard";
    b.disabled = !e;
    b.style.setProperty("--c1", c1);
    b.style.setProperty("--c2", c2);
    if (e) b.style.setProperty("--rc", rarityByKey(e.r).color);
    b.setAttribute("aria-label", e ? `${c.member}, ${c.group}, ${e.r}` : `Carte manquante, ${c.group}`);
    b.innerHTML = e
      ? `<span class="r" style="color:${rarityByKey(e.r).color}">${e.r}</span>
         <div><b>${c.member}</b><br><small>${c.group}</small></div>
         ${e.n > 1 ? `<span class="cnt mono">×${e.n}</span>` : ""}`
      : `<span class="r">Manquante</span>
         <div><b>???</b><br><small>${c.group}</small></div>`;
    if (e) b.addEventListener("click", () => openCard(c.group, c.member));
    wrap.appendChild(b);
  }
}

function openCard(group, member) {
  const e = cardEntry(group, member);
  if (!e) return;
  const { c1, c2 } = groupColors(group);
  const rc = rarityByKey(e.r).color;
  const themes = themesOfGroup(group).map(t => t.name);
  document.getElementById("card-title").textContent = member;
  document.getElementById("card-detail").innerHTML = `
    <div class="ccard" style="--c1:${c1};--c2:${c2};--rc:${rc};cursor:default">
      <span class="r" style="color:${rc}">${e.r}</span>
      <div><b>${member}</b><br><small>${group}</small></div>
    </div>
    <div style="display:grid;gap:10px">
      <div><span class="cooldown">Groupe</span><div>${group}</div></div>
      <div><span class="cooldown">Rareté</span><div style="color:${rc}">${e.r}</div></div>
      <div><span class="cooldown">Exemplaires</span><div class="mono">${e.n}</div></div>
      <div><span class="cooldown">Thèmes</span><div class="chips-inline" style="margin-top:4px">${themes.map(t => `<span>${t}</span>`).join("")}</div></div>
    </div>`;
  document.getElementById("card-dialog").showModal();
}

function renderPanel() {
  const t = themeOf(state.current);
  const { c1, c2 } = packColors(t.id);
  const now = Date.now();
  const free = isFree();
  const remaining = Math.max(0, COOLDOWN_MS - (now - state.last));
  const mm = String(Math.floor(remaining / 60000)).padStart(2, "0");
  const ss = String(Math.floor((remaining % 60000) / 1000)).padStart(2, "0");
  const memberCount = t.groups.reduce((s, n) => s + membersOf(byName[n]).length, 0);

  // Le booster gratuit ne s'applique qu'à une ouverture unique.
  const useFree = free && selectedQty === 1;
  const cost = useFree ? 0 : selectedQty * PACK_PRICE;
  const canOpen = cost === 0 || state.coins >= cost;

  document.getElementById("panel").innerHTML = `
    <div>
      <div style="font-size:12px;color:var(--muted)">Booster thématique</div>
      <div style="font-size:22px;font-weight:800;text-wrap:balance">${t.name}</div>
    </div>
    <div class="stats">
      <div class="stat"><b class="mono">${CARDS_PER_PACK * selectedQty}</b><span>cartes à l'ouverture</span></div>
      <div class="stat"><b class="mono">${t.groups.length}</b><span>groupes dans le thème</span></div>
      <div class="stat"><b class="mono">${memberCount}</b><span>cartes possibles</span></div>
    </div>
    <div class="qty-row">
      <span class="cooldown">Nombre de boosters</span>
      <div class="seg" role="group" aria-label="Nombre de boosters">
        ${QUANTITIES.map(q => `<button data-qty="${q}" aria-pressed="${q === selectedQty}">×${q}</button>`).join("")}
      </div>
    </div>
    <div class="chips-inline">${t.groups.map(n => `<span>${n}</span>`).join("")}</div>
    <div class="chance">
      <div class="cooldown">CHANCE PAR CARTE</div>
      ${CHANCES.map(c => `
        <div class="chance-row">
          <span style="color:${c.color}">${c.key}</span>
          <div class="bar"><i style="--c:${c.color};width:${Math.max(c.pct, 1)}%"></i></div>
          <span class="mono" style="text-align:right">${c.pct} %</span>
        </div>`).join("")}
    </div>
    <button class="open-btn" id="open" ${canOpen ? "" : "disabled"}>
      <span>Ouvrir${selectedQty > 1 ? ` ×${selectedQty}` : ""}</span>
      <span class="mono">${useFree ? "Gratuit" : cost + " ◆"}</span>
    </button>
    <div class="cooldown mono">${free ? "Booster gratuit disponible (ouverture unique)" : `Prochain gratuit dans ${mm}:${ss}`}</div>
    <div class="note">Les chances sont des exemples. Le tirage réel reste à valider côté serveur.</div>`;

  document.querySelectorAll("[data-qty]").forEach(b => {
    b.addEventListener("click", () => { selectedQty = Number(b.dataset.qty); renderPanel(); });
  });
  document.getElementById("open").addEventListener("click", () => startOpening(t, selectedQty, useFree));
}

// --- Ouverture de boosters ---

const dlg = document.getElementById("open-dialog");
const stage = document.getElementById("stage");
const center = document.getElementById("center");
const actions = document.getElementById("actions");
const progress = document.getElementById("progress");

function startOpening(theme, qty, useFree) {
  const total = qty * CARDS_PER_PACK;
  const cards = [];
  for (let i = 0; i < total; i++) {
    const r = rollRarity();
    const { group, member } = pickCard(theme);
    cards.push({ group, member, rarity: r, color: packColors(theme.id) });
  }

  // Ordre de révélation : rareté croissante (Rare d'abord, Mythique en dernier).
  cards.sort((a, b) => rarityIndex(b.rarity.key) - rarityIndex(a.rarity.key));

  // Débit et mise à jour de la collection avant l'animation.
  if (useFree) state.last = Date.now();
  else state.coins -= qty * PACK_PRICE;
  for (const c of cards) {
    state.owned[c.group] = state.owned[c.group] || {};
    const prev = state.owned[c.group][c.member];
    const best = prev && rarityIndex(prev.r) < rarityIndex(c.rarity.key) ? prev.r : c.rarity.key;
    state.owned[c.group][c.member] = { n: (prev ? prev.n : 0) + 1, r: best };
  }
  store.save(state);
  renderHud();
  renderPanel();

  dlg.showModal();
  runOpening(theme, qty, cards);
}

function runOpening(theme, qty, cards) {
  let booster = 0;
  let cardIdx = 0;
  const EPIC_OR_BETTER = rarityIndex("Épique");

  function showPack() {
    stage.className = "stage";
    stage.style.setProperty("--glow", "transparent");
    const { c1, c2 } = packColors(theme.id);
    progress.textContent = qty > 1 ? `Booster ×${qty}` : "Booster";
    center.innerHTML = `<button class="sealed" style="--c1:${c1};--c2:${c2}" id="sealed">
      <span>${theme.name}${qty > 1 ? `<br><small>×${qty}</small>` : ""}</span></button>`;
    actions.innerHTML = `<button class="ghost" id="skip-all">Tout révéler</button>`;
    document.getElementById("sealed").addEventListener("click", tearPack);
    document.getElementById("skip-all").addEventListener("click", showSummary);
  }

  function tearPack() {
    const sealed = document.getElementById("sealed");
    stage.classList.add("shake");
    setTimeout(() => {
      stage.classList.remove("shake");
      sealed.classList.add("tear");
      setTimeout(showNextCard, 500);
    }, 900);
  }

  function advance() {
    cardIdx++;
    if (cardIdx >= cards.length) return showSummary();
    showNextCard();
  }

  // Saute à la prochaine carte Épique ou plus rare.
  // fromNext = true quand la carte courante est déjà révélée : on cherche après elle.
  function jumpToEpic(fromNext) {
    let j = cardIdx + (fromNext ? 1 : 0);
    while (j < cards.length && rarityIndex(cards[j].rarity.key) > EPIC_OR_BETTER) j++;
    if (j >= cards.length) return showSummary();
    cardIdx = j;
    showNextCard();
  }

  function showNextCard() {
    const c = cards[cardIdx];
    const rk = c.rarity.key;
    const isLegend = rk === "Légendaire";
    const isMythic = rk === "Mythique";
    const isEpic = rk === "Épique";
    let revealed = false;
    let ready = false;

    stage.classList.remove("fx-mythic-screen");
    progress.textContent = `Carte ${cardIdx + 1}/${cards.length}`;
    center.innerHTML = `
      <div class="flip-wrap ${isMythic ? "m" : isLegend ? "l" : isEpic ? "e" : "c"}" id="fw">
        <div class="rays"></div>
        <div class="flip" id="flip">
          <div class="face back"><span>?</span></div>
          <div class="face front ${isLegend ? "legend" : ""} ${isMythic ? "mythic" : ""}" style="--c1:${c.color.c1};--c2:${c.color.c2};--rc:${c.rarity.color}">
            <div class="shine"></div>
            <span class="r" style="color:${c.rarity.color}">${rk}</span>
            <div><b>${c.member}</b><br><small>${c.group}</small></div>
          </div>
        </div>
        <div class="fx-layer" id="fx"></div>
      </div>`;
    stage.style.setProperty("--glow", "transparent");
    const fw = document.getElementById("fw");
    fw.addEventListener("pointermove", e => {
      if (revealed) return;
      const r = fw.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - 0.5;
      const y = (e.clientY - r.top) / r.height - 0.5;
      fw.style.setProperty("--ry", `${x * 22}deg`);
      fw.style.setProperty("--rx", `${-y * 22}deg`);
    });
    fw.addEventListener("pointerleave", () => {
      fw.style.setProperty("--ry", "0deg");
      fw.style.setProperty("--rx", "0deg");
    });

    function showActions() {
      actions.innerHTML = revealed
        ? `<button class="big-btn" id="next">${cardIdx + 1 >= cards.length ? "Voir le résumé" : "Carte suivante"}</button>
           <button class="ghost" id="jump">Prochain Épique+</button>
           <button class="ghost" id="skip">Tout révéler</button>`
        : `<button class="big-btn" id="tap">Tap pour révéler</button>
           <button class="ghost" id="jump">Prochain Épique+</button>
           <button class="ghost" id="skip">Tout révéler</button>`;
      document.getElementById("jump").addEventListener("click", () => jumpToEpic(revealed));
      document.getElementById("skip").addEventListener("click", showSummary);
      const n = document.getElementById("next");
      if (n) n.addEventListener("click", advance);
      const t = document.getElementById("tap");
      if (t) t.addEventListener("click", doReveal);
    }

    function doReveal() {
      if (revealed) return;
      revealed = true;
      const flip = document.getElementById("flip");
      const fxEl = document.getElementById("fx");
      flip.classList.add("open");
      fw.classList.add("revealed");
      setTimeout(() => {
        if (isMythic) {
          stage.style.setProperty("--glow", "rgba(239,68,68,.35)");
          fw.classList.add("mythic-fx");
          stage.classList.add("fx-mythic-screen");
          fxEl.innerHTML = burstHtml("#ef4444", "#a855f7", 36) + `<div class="banner" style="--fx:#ef4444">MYTHIQUE</div>`;
          if (navigator.vibrate) navigator.vibrate([60, 40, 120]);
        } else if (isLegend) {
          stage.style.setProperty("--glow", "rgba(250,204,21,.3)");
          fw.classList.add("legend-fx");
          fxEl.innerHTML = burstHtml("#facc15", "#fde68a", 24) + `<div class="banner" style="--fx:#facc15">LÉGENDAIRE</div>`;
          if (navigator.vibrate) navigator.vibrate(80);
        } else if (isEpic) {
          stage.style.setProperty("--glow", "rgba(168,85,247,.25)");
          fxEl.innerHTML = burstHtml("#a855f7", "#a855f7", 10);
        }
        ready = true;
        showActions();
      }, 750);
    }

    // Cliquer sur la carte la retourne, puis passe à la suivante.
    fw.addEventListener("click", () => {
      if (!revealed) doReveal();
      else if (ready) advance();
    });

    showActions();
  }

  function burstHtml(color, sparkColor, n) {
    let s = `<div class="burst" style="--fx:${color}"></div><div class="burst b2" style="--fx:${color}"></div>`;
    for (let i = 0; i < n; i++) {
      const a = (Math.PI * 2 * i) / n;
      const d = 120 + Math.random() * 90;
      s += `<span class="spark" style="--fx:${sparkColor};--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d}px;animation-delay:${Math.random() * 0.15}s"></span>`;
    }
    return s;
  }

  function showSummary() {
    stage.className = "stage";
    stage.style.setProperty("--glow", "transparent");
    progress.textContent = `${cards.length} carte${cards.length > 1 ? "s" : ""}`;
    center.innerHTML = `<div class="summary">${cards.map(c => `
      <div class="mini" style="--c1:${c.color.c1};--c2:${c.color.c2};--rc:${c.rarity.color}">
        <span class="r" style="color:${c.rarity.color}">${c.rarity.key}</span>
        <div><b>${c.member}</b><br><small>${c.group}</small></div>
      </div>`).join("")}</div>`;
    actions.innerHTML = `<button class="big-btn" id="close-open">Fermer</button>`;
    document.getElementById("close-open").addEventListener("click", () => dlg.close());
  }

  showPack();
}

// --- Navigation et événements ---

function setView(view) {
  const boosters = view === "boosters";
  document.getElementById("view-boosters").hidden = !boosters;
  document.getElementById("view-collection").hidden = boosters;
  document.getElementById("nav-boosters").setAttribute("aria-current", boosters ? "page" : "false");
  document.getElementById("nav-collection").setAttribute("aria-current", boosters ? "false" : "page");
  if (!boosters) renderCollection();
}

document.getElementById("nav-boosters").addEventListener("click", () => setView("boosters"));
document.getElementById("nav-collection").addEventListener("click", () => setView("collection"));
document.getElementById("close-card").addEventListener("click", () => {
  document.getElementById("card-dialog").close();
});
document.querySelectorAll(".seg [data-status]").forEach(btn => {
  btn.addEventListener("click", () => {
    collFilter.status = btn.dataset.status;
    document.querySelectorAll(".seg [data-status]").forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
    renderCollection();
  });
});
document.getElementById("theme-filter").addEventListener("change", e => {
  collFilter.theme = e.target.value;
  renderCollection();
});
document.getElementById("rarity-filter").addEventListener("change", e => {
  collFilter.rarity = e.target.value;
  renderCollection();
});
// Empêche de fermer l'ouverture avec Échap pendant une animation en cours (sécurité simple).
dlg.addEventListener("cancel", e => { if (!document.getElementById("close-open")) e.preventDefault(); });
document.getElementById("discord").addEventListener("click", () => {
  // Maquette : la vraie connexion Discord (OAuth) demande un petit serveur.
  state.discord = { name: "Invité" };
  store.save(state);
  renderHud();
});

document.getElementById("test-coins").addEventListener("click", () => {
  state.coins += 150000;
  store.save(state);
  renderHud();
  renderPanel();
});

populateThemeFilter();
setView("boosters");
renderHud();
renderGrid();
renderPanel();
setInterval(() => { if (!dlg.open) renderPanel(); }, 1000);
</script>
